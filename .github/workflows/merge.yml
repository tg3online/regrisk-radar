name: Merge incoming radar drops

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.json'
      - 'merge_incoming.py'
      - '.github/workflows/merge.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Merge incoming drop files
        run: python3 merge_incoming.py
      - name: Commit merged data
        run: |
          FILES="items.json merge_incoming.py"
          STATUS="$(git status --porcelain $FILES incoming 2>/dev/null || git status --porcelain $FILES)"
          if [ -n "$STATUS" ]; then
            git config user.name "regrisk-merge-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            if [ -d incoming ]; then
              git add incoming
            else
              git add -u incoming 2>/dev/null || true
            fi
            git commit -m "radar: merge incoming drops [auto]"
            git push
          fi
