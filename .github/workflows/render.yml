name: Render site
on:
  push:
    branches: [main]
    paths:
      - items.json
      - render.py
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Render index.html + feed.xml from items.json
        run: python3 render.py
     - name: Commit rendered files if they changed
        run: |
          FILES="index.html feed.xml atom.xml feed.json latest.json sitemap.xml robots.txt"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "regrisk-render-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "render: rebuild from items.json [auto]"
            git push
          fi
